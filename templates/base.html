<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Протоколы соревнований{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #10190f;
            --card: #1a321c;
            --border: #10190f;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #ff9e58;
            --accent-hover: #ffbc79;
            --success: #3fb950;
            --danger: #f85149;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            line-height: 1.5;
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }
        header h1 a { color: var(--text); text-decoration: none; }
        header h1 a:hover { color: var(--accent); }
        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-right: 1rem;
        }
        nav a:hover { color: var(--accent); }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 { margin-top: 0; font-size: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.35rem; color: var(--muted); font-size: 0.9rem; }
        .form-control {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }
        input[type="checkbox"] { margin-right: 0.5rem; }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #ffbc79; }
        .messages { list-style: none; padding: 0; margin: 0 0 1rem 0; }
        .messages li {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .success { background: rgba(63, 185, 80, 0.2); color: var(--success); }
        .error { background: rgba(248, 81, 73, 0.2); color: var(--danger); }
        .warning { background: rgba(210, 153, 34, 0.2); color: #d29922; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .meta { color: var(--muted); font-size: 0.9rem; }
        .points { font-weight: 600; color: var(--accent); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="wrap">
        <header>
            <h1><a href="{% url 'protocols:home' %}">Протоколы соревнований</a></h1>
            <nav>
                <a href="{% url 'protocols:home' %}">Главная</a>
                <a href="{% url 'protocols:calendar' %}">Календарь</a>
                <a href="{% url 'protocols:season_export_page' %}">Экспорт за период</a>
                <a href="{% url 'protocols:known_participants' %}">Участники в базе</a>
                <a href="{% url 'admin:index' %}">Админка</a>
            </nav>
        </header>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
